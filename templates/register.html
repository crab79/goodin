<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>會員註冊</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/><style>body{background-image:url('re2.png');background-size:cover;background-position:center;background-repeat:no-repeat;height:100vh;overflow:hidden;display:flex;flex-direction:column}.header{background-color:#4e73df;color:#fff;text-align:center;padding:15px;font-size:1.5rem;font-weight:700}.main-content{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:20px;background-color:rgba(255,255,255,.85)}.section{flex:1;padding:20px}.left-section{text-align:center}.left-section img{width:120px;margin-bottom:15px}.slogan{font-size:1.6rem;font-weight:700;color:#2c3e50;line-height:1.6}.register-box{background:#fff;padding:30px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1);width:100%;max-width:350px;margin:0 auto}.right-section{font-size:1.25rem;line-height:1.8;color:#333}.right-section h5{font-size:1.5rem;margin-bottom:1rem;font-weight:700;color:#2c3e50}.right-section ul{padding-left:1.2rem;margin-bottom:0}.right-section li{margin-bottom:.6rem}.right-section li::before{content:"✅ ";color:#28a745;font-size:1.2rem}.right-section ul{padding-left:1.2rem;margin-bottom:0;list-style:none}@media (max-width:992px){.main-content{flex-direction:column;text-align:center}.section{width:100%}}</style><script defer="defer" src="{{ url_for('static', filename='js/app.bundle.js') }}"></script><script defer="defer" src="{{ url_for('static', filename='js/register.bundle.js') }}"></script></head><body><div class="header">GoodIn 股引</div><div class="main-content"><div class="section left-section"><div class="slogan">「陪你從零到有，一步步學會投資」</div></div><div class="section"><div class="register-box text-center"><h3 class="mb-4">會員註冊</h3><form id="register-form"><div class="mb-3"><input class="form-control" placeholder="輸入會員名稱 ✍" required=""/></div><div class="mb-3"><input class="form-control" placeholder="輸入電子郵件 📧" required="" type="email"/></div><div class="mb-3"><input class="form-control" placeholder="輸入密碼 🔑" required="" type="password"/></div><div class="mb-3"><input class="form-control" placeholder="再次輸入密碼 🔑" required="" type="password"/></div><div class="mb-3"><input class="form-control" placeholder="輸入手機號碼 📱" required="" type="tel"/></div><div class="mb-3 d-none" id="verify-code-group"><input class="form-control" id="verify-code-input" placeholder="輸入驗證碼"/></div><button class="btn btn-primary w-100" id="register-btn" type="submit">🚀 註冊</button> <button class="btn btn-success w-100 mt-2 d-none" id="verify-btn" type="button">送出驗證碼</button></form><hr/><a class="btn btn-secondary w-100" href="{{ url_for('visitor_home') }}">👀 訪客登入</a><div class="mt-3"><a class="text-decoration-none" href="{{ url_for('find_password') }}">忘記密碼？</a> | <a class="text-decoration-none" href="{{ url_for('login') }}">回到登入</a></div></div></div><div class="section right-section"><h5>註冊成為會員可享：</h5><ul><li>技術分析入門課程</li><li>實戰模擬股票操作</li><li>歷史/即時股市觀察</li><li>自訂追蹤投資組合工具</li></ul></div></div></body></html>
