<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>編輯個人資料</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='e5a9c1a0a33aefa9a57e.css') }}" rel="stylesheet" />
  <link href="{{ url_for('static', filename='5e28aab59329b5f50217.css') }}" rel="stylesheet" />
  <script defer src="{{ url_for('static', filename='app.bundle.js') }}"></script>
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8f9fc;
    }
    .edit-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .edit-card {
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      padding: 2rem 3rem;
      max-width: 500px;
      width: 100%;
    }
    .edit-card h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #2e59d9;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 0.5rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    .button-group {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .edit-button {
      background-color: #4e73df;
      color: white;
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .edit-button:hover {
      background-color: #2c5dc3;
    }
    .cancel-button {
      background-color: #9da4ae;
      color: white;
      padding: 0.5rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    .cancel-button:hover {
      background-color: #738ea6;
    }
  </style>
</head>
<body id="page-top">
  <div id="wrapper">
    {% include 'sidebar.html' %}
    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        {% include 'topbar.html' %}
        <div class="container-fluid edit-wrapper">
          <div class="edit-card">
            <h2>編輯個人資料</h2>
            <form action="/save-profile" method="POST">
              <div class="form-group">
                <label for="name">會員姓名</label>
                <input type="text" id="name" name="name" value="劉小明">
              </div>
              <div class="form-group">
                <label for="gender">性別</label>
                <input type="text" id="gender" name="gender" value="男">
              </div>
              <div class="form-group">
                <label for="phone">手機</label>
                <input type="text" id="phone" name="phone" value="0917-171717">
              </div>
              <div class="form-group">
                <label for="email">信箱</label>
                <input type="email" id="email" name="email" value="www@gmail.com">
              </div>
              <div class="button-group">
                <button type="submit" class="edit-button">儲存</button>
                <button type="button" class="cancel-button" onclick="history.back()">取消</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <footer class="sticky-footer bg-white">
        <div class="container my-auto">
          <div class="copyright text-center my-auto">
            <span>2025</span>
          </div>
        </div>
      </footer>
    </div>
  </div>
</body>
</html>
