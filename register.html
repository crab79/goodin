<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>會員註冊</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-image: url('re2.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #4e73df;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.85);
    }

    .section {
      flex: 1;
      padding: 20px;
    }

    .left-section {
      text-align: center;
    }

    .left-section img {
      width: 120px;
      margin-bottom: 15px;
    }

.slogan {
  font-size: 1.6rem;       /* ✅ 字體變大 */
  font-weight: bold;       /* ✅ 粗體 */
  color: #2c3e50;
  line-height: 1.6;
}


    .register-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 350px;
      margin: 0 auto;
    }

.right-section {
  font-size: 1.25rem;       /* 字體放大 */
  line-height: 1.8;
  color: #333;
}

.right-section h5 {
  font-size: 1.5rem;         /* 標題更醒目 */
  margin-bottom: 1rem;
  font-weight: bold;
  color: #2c3e50;
}

.right-section ul {
  padding-left: 1.2rem;
  margin-bottom: 0;
}

.right-section li {
  margin-bottom: 0.6rem;     /* 每個項目間隔更大 */
}

.right-section li::before {
  content: "✅ ";
  color: #28a745;
  font-size: 1.2rem;         /* ✅ 符號也變大 */
}
.right-section ul {
  padding-left: 1.2rem;
  margin-bottom: 0;
  list-style: none;  /* 💡 重點：取消原生點點 */
}



    @media (max-width: 992px) {
      .main-content {
        flex-direction: column;
        text-align: center;
      }
      .section {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">GoodIn 股引</div>

  <div class="main-content">
    <!-- 左側：品牌區塊 -->
    <div class="section left-section">
      <!--<img src="logo.png" alt="品牌 Logo" />-->
      <div class="slogan">「陪你從零到有，<br>一步步學會聰明投資」</div>
    </div>

    <!-- 中間：註冊表單 -->
    <div class="section">
      <div class="register-box text-center">
        <h3 class="mb-4">會員註冊</h3>
        <form>
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="輸入會員名稱 " required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="輸入電子郵件 📧" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" placeholder="輸入密碼 🔑" required>
          </div>
          <div class="mb-3">
            <input type="password" class="form-control" placeholder="再次輸入密碼 🔑" required>
          </div>
          <div class="mb-3">
            <input type="tel" class="form-control" placeholder="輸入手機號碼 📱" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">🚀 註冊</button>
        </form>
        <hr>
        <button class="btn btn-secondary w-100">👀 訪客登入</button>
        <div class="mt-3">
          <a href="#" class="text-decoration-none">忘記密碼？</a> | 
          <a href="login.html" class="text-decoration-none"> 回到登入</a>
        </div>
      </div>
    </div>

    <!-- 右側：註冊好處 -->
    <div class="section right-section">
      <h5>註冊成為會員可享：</h5>
      <ul>
        <li>技術分析入門課程</li>
        <li>實戰模擬股票操作</li>
        <li>歷史/即時股市觀察</li>
        <li>自訂追蹤投資組合工具</li>
      </ul>
    </div>
  </div>
</body>
</html>
